name: Keep Render Backend Awake

on:
  schedule:
    # Runs every 14 minutes to prevent Render free instance from spinning down
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Health Endpoint
        run: |
          curl -s https://unthinkable-assignment-vcj0.onrender.com/api/health || true
